[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dockerfiles-templates"
version = "0.1.0"
description = "Reusable Python API for templates.yml used by althack/dockerfiles."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Allison Thackston" }
]
dependencies = [
  "ruamel.yaml>=0.19.0",
  "jsonschema>=4.0.0"
]

[project.optional-dependencies]
scripts = [
  "actions-toolkit>=0.1.15",
  "click>=8.1",
  "Jinja2>=3.1"
]
dev = [
  "flake8>=7.3",
  "pydocstyle>=6.3"
]

[project.urls]
Homepage = "https://github.com/althack/dockerfiles"
Repository = "https://github.com/althack/dockerfiles"
Issues = "https://github.com/althack/dockerfiles/issues"

[tool.setuptools.packages.find]
include = ["dockerfiles_templates*"]
