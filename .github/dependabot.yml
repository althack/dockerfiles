version: 2
updates:
  - package-ecosystem: github-actions
    directories: 
      - "/"
      - "/.github/actions/**"
    schedule:
      interval: daily
    groups:
      github-actions-all:
        patterns:
          - "*"
    open-pull-requests-limit: 10
  - package-ecosystem: pip
    directories:
      - "/"
      - "/.github/actions/**"
    schedule:
      interval: daily
    groups:
      python-deps:
        patterns:
          - "*"
    open-pull-requests-limit: 10
