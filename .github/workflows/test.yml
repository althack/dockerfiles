name: Test

on:
  pull_request:
  workflow_dispatch:

concurrency:   
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install pip packages
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: flake8
        run: |
          flake8 .
      - name: pydocstyle
        run: |
          pydocstyle .

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Run action unit tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[scripts]"
          python -m unittest discover -s .github/actions -p 'test_*.py'

      - name: Run API unit tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'

  targets:
    runs-on: ubuntu-latest
    outputs:
      amd64: ${{ steps.amd64.outputs.distros }}
      arm64: ${{ steps.arm64.outputs.distros }}
      has_changes: ${{ steps.filter.outputs.affected }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find changed files
        uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: csv
          filters: |
            docker:
              - '*/*.Dockerfile'
            action:
              - '.github/actions/docker-*/*'
            affected:
              - '*/*.Dockerfile'
              - '.github/actions/docker-*/*'

      - name: amd64 targets
        run: |
          {
            echo "## AMD64"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Generate list of amd64 targets (filtered)
        id: amd64
        uses: ./.github/actions/docker-targets
        with:
          changed: ${{ steps.filter.outputs.docker_files }}
          all: ${{ steps.filter.outputs.action }}

      - name: arm64 targets
        run: |
          {
            echo "## ARM64"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate list of arm64 targets (filtered)
        id: arm64
        uses: ./.github/actions/docker-targets
        with:
          platform: "linux/arm64"
          changed: ${{ steps.filter.outputs.docker_files }}
          all: ${{ steps.filter.outputs.action }}

  bake-build-amd64:
    name: Build (${{ matrix.family }}:${{ matrix.distro }} @ amd64
    needs: targets
    if: ${{ needs.targets.outputs.has_changes == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.amd64) }}

    steps:
      - uses: actions/checkout@v7

      - name: Build via composite action
        uses: ./.github/actions/docker-bake
        with:
          family: ${{ matrix.family }} # e.g. ros2
          distro: ${{ matrix.distro }} # e.g. rolling
          ghcr-username: ${{ github.actor }} # optional
          ghcr-password: ${{ secrets.GITHUB_TOKEN }} # optional
          gha-cache: ${{ contains(matrix.distro, 'cuda') && 'from' || 'all' }}
          push: "false"

  bake-build-arm64:
    name: Build (${{ matrix.family }}:${{ matrix.distro }} @ arm64)
    needs: targets
    if: ${{ needs.targets.outputs.has_changes == 'true' }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.arm64) }}

    steps:
      - uses: actions/checkout@v7

      - name: Build via composite action
        uses: ./.github/actions/docker-bake
        with:
          family: ${{ matrix.family }} # e.g. ros2
          distro: ${{ matrix.distro }} # e.g. rolling
          ghcr-username: ${{ github.actor }} # optional
          ghcr-password: ${{ secrets.GITHUB_TOKEN }} # optional
          gha-cache: ${{ contains(matrix.distro, 'cuda') && 'from' || 'all' }}
          push: "false"

  merge-manifests:
    name: Merge manifests (${{ matrix.family }}:${{ matrix.distro }})
    needs:
      - bake-build-amd64
      - bake-build-arm64
      - targets
    if: ${{ needs.targets.outputs.has_changes == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.amd64) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Download bake metadata artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bake-metadata-${{ matrix.family }}-${{ matrix.distro }}-*
          path: bake-metadata
          merge-multiple: true

      - name: Merge manifests
        uses: ./.github/actions/docker-merge
        with:
          family: ${{ matrix.family }}
          distro: ${{ matrix.distro }}
          metadata: |
            bake-metadata
          ghcr-username: ${{ github.repository_owner }}
          ghcr-password: ${{ secrets.GITHUB_TOKEN }}
          dry-run: "true"

  complete:
    if: ${{ always() }}
    needs:
      - lint
      - unit-test
      - targets
      - bake-build-amd64
      - bake-build-arm64
      - merge-manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check required job results
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
          BUILDS_REQUIRED: ${{ needs.targets.outputs.has_changes == 'true' }}
        run: |
          echo "$NEEDS_RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! echo "$NEEDS_RESULTS" | jq -e --argjson builds_required "$BUILDS_REQUIRED" '
            all(to_entries[];
              .value.result == "success"
              or (($builds_required | not)
                and .value.result == "skipped"
                and (.key == "bake-build-amd64" or .key == "bake-build-arm64" or .key == "merge-manifests")))
          ' > /dev/null; then
            echo "::error::A required job failed, was cancelled, or was unexpectedly skipped."
            exit 1
          fi
          echo "All required jobs passed!"
