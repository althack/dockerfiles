# Do not edit directly; update the template instead.

name: PR Automerge

on:
  pull_request_target:
    types:
      - labeled
      - unlabeled
      - ready_for_review

concurrency:
  # Queue label bursts so required checks are not left cancelled. Poll mode
  # rechecks the live PR state and automerge label immediately before merging.
  group: "pr-automerge-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: false

jobs:
  pr-automerge:
    permissions:
      contents: write
      pull-requests: write
      checks: read
    uses: athackst/ci/.github/workflows/automerge.yml@main
    with:
      automerge-mode: poll
    secrets:
      token: ${{ secrets.CI_BOT_TOKEN }}
